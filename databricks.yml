# Databricks Asset Bundle — frontend (SPA Vite/React) como Databricks App.
# Docs: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/bundles/apps-tutorial
# Deploy:  databricks bundle deploy --target prod
# Arranca: databricks bundle run frontend --target prod
#
# PARÁMETROS POR ENTORNO = sección `variables:`. NINGUNO hay que editar por
# ambiente: el workflow los exporta como `BUNDLE_VAR_<nombre>` desde las GitHub
# Variables del repo cuando existen, y si no existen mandan estos defaults.
# La config de runtime vive en `config:` (sustituye al viejo app.yaml;
# requiere CLI ≥ 0.283 — el workflow usa setup-cli@main = último).
bundle:
  name: frnt-data-model-hub

variables:
  backend_api_url:
    # GitHub Variable: BACKEND_API_URL (obligatoria en un workspace nuevo — el
    # default apunta al workspace original y el front quedaría hablándole a otro).
    description: "URL pública de la app backend (bknd-data-model-hub) de ESTE workspace — destino del proxy /api de server.mjs (runtime, ya no se inlinea en el build)."
    default: https://bknd-data-model-hub-3871428306507680.0.azure.databricksapps.com
  app_admin_user:
    # GitHub Variable: APP_ADMIN_USER (opcional).
    # Cuando el deploy lo hace un SERVICE PRINCIPAL (token de CI), `mode:
    # production` le da CAN_MANAGE SOLO a ese SP y el humano que creó la app
    # pierde hasta el botón de Stop. Con esta variable el humano recupera el
    # control en cada deploy.
    # El default es la identidad que despliega: repite el grant que production
    # mode ya hace (el CLI lo deduplica) → sin la variable NO se agrega a nadie
    # extra y el deploy no falla.
    description: "Usuario humano que queda con CAN_MANAGE sobre la app (stop/start/logs desde la UI)."
    default: ${workspace.current_user.userName}

resources:
  apps:
    frontend:                     # resource key (lo usa `databricks bundle run frontend`)
      name: frnt-data-model-hub   # nombre real de la app en el workspace
      source_code_path: .         # el código de la app está en la raíz del repo
      description: "Data Model Hub — frontend (SPA Vite/React · editor ER)."
      config:
        # `npm run start` dispara `prestart` (tsc + vite build → dist/) y
        # luego `node server.mjs` (doc 36): server propio que sirve dist/ y
        # PROXYA /api al backend servidor-a-servidor con el token M2M del
        # service principal del front (Databricks inyecta DATABRICKS_HOST y
        # CLIENT_ID/SECRET; el server lee DATABRICKS_APP_PORT solo).
        # El navegador asi habla con UN solo origen: sin CORS, sin doble SSO.
        # ONE-TIME por workspace: CAN_USE del SP del front sobre la app
        # backend (doc 36 §5).
        # NO setear NODE_ENV=production (romperia el `npm install` de
        # devDeps → vite/tsc se necesitan para el build).
        # OJO: VITE_API_URL ya NO se define → API_BASE queda VACIO en el build
        # y el front usa rutas RELATIVAS /api (mismo origen). Definirla aqui
        # reactivaria el cruce navegador→backend (el bug del doble SSO).
        command: ['npm', 'run', 'start']
        env:
          # Runtime (server.mjs): destino del proxy /api.
          - name: BACKEND_API_URL
            value: ${var.backend_api_url}
      permissions:
        - level: CAN_MANAGE       # el humano dueño: stop/start/logs/permissions en la UI
          user_name: ${var.app_admin_user}
        - level: CAN_USE
          group_name: users       # todos los usuarios del workspace pueden abrir la app

targets:
  prod:
    mode: production
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
