# Databricks Asset Bundle — frontend (SPA Vite/React) como Databricks App.
#
# Declara lo que el bundle aplica en cada despliegue: la app, sus permisos y el
# binding del secreto compartido. La configuración de runtime (command + env)
# vive en app.yaml; el bloque `config:` de este archivo no se usa porque el CLI
# lo ignora en silencio (issue databricks/cli #4901).
#
# Ninguna variable lleva `default:`: el workflow de despliegue exporta cada una
# como BUNDLE_VAR_<variable> desde la GitHub Variable homónima en mayúsculas.
# Un despliegue manual exporta esos BUNDLE_VAR_* y DATABRICKS_HOST antes de
# `databricks bundle deploy --target <target>`.
bundle:
  name: frnt-data-model-hub
  # Motor "direct": el CLI aplica el bundle llamando a la API de Databricks,
  # sin Terraform. Es el motor por defecto del CLI desde la 1.14.0; se declara
  # explícito para que ningún workspace use el motor Terraform, en desuso en el CLI.
  engine: direct

variables:
  databricks_scope_name:
    # GitHub Variable DATABRICKS_SCOPE_NAME — ej. kv-scope-dmh (el mismo scope que usa el backend)
    description: "Scope de secretos del workspace que guarda el secreto compartido del relay SSO."
  proxy_secret_key:
    # GitHub Variable PROXY_SECRET_KEY — ej. dmh-proxy-secret (la misma key que usa el backend)
    description: "Key (dentro del scope) del secreto compartido front↔backend que autentica el relay SSO."
  app_admin_user:
    # GitHub Variable APP_ADMIN_USER — ej. usuario@dominio.com (usuario del workspace)
    description: "Usuario que conserva CAN_MANAGE sobre la app (stop/start/logs desde la UI)."

resources:
  apps:
    frontend:                     # resource key: el workflow lo detecta para bind/run
      name: frnt-data-model-hub   # nombre real de la app en el workspace
      source_code_path: .
      description: "Data Model Hub — frontend (SPA Vite/React · editor ER)."
      resources:
        - name: proxy_secret
          description: "Secreto compartido front↔backend que autentica el relay de identidad SSO."
          secret:
            scope: ${var.databricks_scope_name}
            key: ${var.proxy_secret_key}
            permission: READ
      permissions:
        - level: CAN_MANAGE       # el usuario administrador definido en app_admin_user
          user_name: ${var.app_admin_user}
        - level: CAN_USE
          group_name: users       # todos los usuarios del workspace pueden abrir la app

targets:
  prod:
    mode: production
    default: true
    workspace:
      # Sin `host:` a propósito: el workspace destino sale de la variable de
      # entorno DATABRICKS_HOST (un host aquí ganaría sobre esa variable y
      # obligaría a editar el repositorio por cada ambiente).
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
